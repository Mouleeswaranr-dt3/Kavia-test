schema_version: "1.0"

shared_runtime_assets:
  - id: "spec_builder.renderer_registry"
    source_path: "CodeGenerationAgent/src/code_generation_core_agent/spec_builder/source_assets/runtime_assets/spec-builder-renderer-registry.js"
    description: "Shared renderer registry used by Spec Builder client-side pages."
  - id: "spec_builder.tags_css"
    source_path: "CodeGenerationAgent/src/code_generation_core_agent/spec_builder/source_assets/runtime_assets/spec-builder-tags.css"
    description: "Shared Spec Builder tag and badge styles."

artifacts:
  - id: "spec_builder.roadmap"
    slug: "roadmap"
    title: "Roadmap"
    description: "Top-level Spec Builder roadmap container that holds roadmap metadata, item references, milestones, and overview planning data."
    classification: "spec_builder"
    artifact_format: "json"
    visibility:
      - "artifact_config_panel"
      - "codewiki_nav"
    outputs:
      - "json"
      - "markdown_generated"
      - "index_updates"
    rendering_components:
      - "summaryTable"
      - "tagsContainer"
      - "linksSection"
      - "extraFields"
    renderers:
      client_side:
        js: "CodeGenerationAgent/src/code_generation_core_agent/spec_builder/source_assets/runtime_assets/roadmap.js"
        css: "CodeGenerationAgent/src/code_generation_core_agent/spec_builder/source_assets/runtime_assets/roadmap.css"
    skills:
      static_skill_slugs:
        - "spec_builder_roadmap"
      dynamic_skill_slugs: []
      component_refs:
        artifact:
          - "components/artifacts/roadmap.md"
    samples:
      json_sample_path: "kavia-docs/CodeWiki/Artifacts/SpecBuilder/json/_samples/roadmap.json"
      markdown_sample_path: "kavia-docs/CodeWiki/Artifacts/SpecBuilder/pages/_samples/roadmap.md"
    document_actions:
      metadata_path: "kavia-docs/CodeWiki/assets/document_action_metadata.json"

  - id: "spec_builder.roadmap_item"
    slug: "roadmap_item"
    title: "Roadmap Item"
    description: "A roadmap item artifact."
    classification: "spec_builder"
    artifact_format: "json"
    visibility:
      - "artifact_config_panel"
      - "codewiki_nav"
    emits_hub_alias_page: true
    link_extractors:
      - from_type: "test_case"
        fields:
          - "roadmap_item_id"
          - "roadmap_item_ids"
          - "related_roadmap_item_ids"
          - "roadmap_ids"
    outputs:
      - "json"
      - "markdown_generated"
      - "index_updates"
    rendering_components:
      - "summaryTable"
      - "crossArtifactTable"
      - "tagsContainer"
      - "linksSection"
      - "acceptanceCriteria"
      - "extraFields"
    table_patterns:
      - pattern_id: "epics_and_stories"
        source_field: "epic_ids"
        resolve_type: "epic"
        nested:
          source_field: "story_ids"
          resolve_type: "user_story"
        columns:
          - field: "id"
            heading: "ID"
            link_to_page: true
          - field: "title"
            heading: "Title"
          - field: "status"
            heading: "Status"
          - field: "priority"
            heading: "Priority"
      - pattern_id: "test_cases"
        source_field: "test_case_ids"
        resolve_type: "test_case"
        columns:
          - field: "id"
            heading: "Test ID"
            link_to_page: true
          - field: "title"
            heading: "Title"
          - field: "status"
            heading: "Status"
    renderers:
      client_side:
        js: "CodeGenerationAgent/src/code_generation_core_agent/spec_builder/source_assets/runtime_assets/roadmap_item.js"
        css: "CodeGenerationAgent/src/code_generation_core_agent/spec_builder/source_assets/runtime_assets/roadmap_item.css"
    skills:
      static_skill_slugs:
        - "spec_builder_roadmap_item"
      dynamic_skill_slugs: []
      component_refs:
        artifact:
          - "components/artifacts/roadmap_item.md"
    samples:
      json_sample_path: "kavia-docs/CodeWiki/Artifacts/SpecBuilder/json/_samples/roadmap_item.json"
      markdown_sample_path: "kavia-docs/CodeWiki/Artifacts/SpecBuilder/pages/_samples/roadmap_item.md"
    document_actions:
      metadata_path: "kavia-docs/CodeWiki/assets/document_action_metadata.json"

