name: High Level Design HLD Generator
description: This skill guides the AI to generate a comprehensive, structured High
  Level Design (HLD) document. It ensures the output consistently follows a standardized
  15-section template aligned with IEEE 1016-2009, the C4 Model, OpenAPI 3.1, and
  AsyncAPI 3.0 standards, making it ready for engineering teams and Low Level Design
  (LLD) derivation.
